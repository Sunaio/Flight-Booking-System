<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<!-- Navbar -->
<nav class="auth-navbar">
    <div class="auth-nav-container">
        <a href="login.html" class="back">← Back to Login</a>
    </div>
</nav>

<!-- Registration form -->
<div class="auth-wrapper">
    <div class="auth-box">
        <h2>Create Account</h2>
        <form>
            <input type="text" placeholder="First Name" class="auth-input" required>
            <input type="text" placeholder="Last Name" class="auth-input" required>
            <input type="email" placeholder="Email" class="auth-input" required>
            <input type="password" placeholder="Password" class="auth-input" required>
            <input type="password" placeholder="Confirm Password" class="auth-input" required>
            <button type="submit" class="auth-register-btn">Register</button>
        </form>
        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</div>
<script src="scripts/auth.js"></script>
</body>
</html>
