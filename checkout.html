<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Flight</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/checkout.css">
</head>
<body>
    <main class="booking-page">
        <div class="card" id="flightSummaryCard">
            <p class="card-label">Flight summary</p>
            <div class="flight-summary">
                <div>
                    <div class="route">
                        <span id="depAirport"></span>
                        <span class="route-arrow">→</span>
                        <span id="arrAirport"></span>
                    </div>
                    <p class="meta" id="date"></p>
                    <p class="meta" id="time"></p>
                </div>
                <div class="price-tag" id="priceDisplay">
                    <span id="flightCost"></span>
                </div>
            </div>
        </div>

        <!-- Seat Selection -->
        <div class="card">
            <p class="card-label">Select a seat</p>
            <div class="class-tabs">
                <button class="tab active" data-class="economy">Economy</button>
                <button class="tab" data-class="business">Business</button>
                <button class="tab" data-class="first">First</button>
            </div>
            <div class="seat-map">
                <div class="seat-labels">
                    <span></span>
                    <span>A</span><span>B</span><span>C</span>
                    <span class="aisle"></span>
                    <span>D</span><span>E</span><span>F</span>
                </div>
                <div id="seatGrid" class="seat-grid"></div>
            </div>
            <div class="legend">
                <span class="legend-item"><span class="legend-dot available"></span>Available</span>
                <span class="legend-item"><span class="legend-dot taken"></span>Taken</span>
                <span class="legend-item"><span class="legend-dot selected"></span>Selected</span>
            </div>
            <p class="selected-seat-label">Selected seat: <strong id="selectedSeatDisplay">None</strong></p>
        </div>

        <!-- Passenger Details -->
        <div class="card">
            <p class="card-label">Passenger details</p>
            <form id="bookingForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First name</label>
                        <input type="text" id="firstName" placeholder="First Name" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last name</label>
                        <input type="text" id="lastName" placeholder="Last Name" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Confirm booking</button>
                <button type="button" class="cancel-btn" onclick="window.location.href='booksearch.html'">Cancel Booking</button>
            </form>
        </div>

    </main>

    <!-- Confirmation Popup -->
    <div id="confirmPopup" class="popup-overlay" hidden>
        <div class="popup">
            <h2>Check your information!</h2>
            <p id="confirmSummary"></p>
            <button class="submit-btn">Submit</button>
            <button class="cancel-btn" onclick="document.getElementById('confirmPopup').hidden = true">Cancel</button>
        </div>
    </div>

    <!-- Booking Confirmation -->
     <div id="bookingConfirmPopup" class="popup-overlay" hidden>
        <div class="popup">
            <div class="popup-icon">✓</div>
            <h2>Booking Confirmed!</h2>
            <p>Your flight has been successfully booked.</p>
            <button class="submit-btn" onclick="window.location.href='booksearch.html'">Exit</button>
        </div>
    </div>
    <script src="scripts/checkout.js"></script>
</body>
</html>
