<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flight Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/booksearch.css">
</head>
<body>
    <!-- Navigation Bar -->
   <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <h1>Fly</h1>
            </div>
        </div>
    </nav>

    <!-- Search Section -->
    <section class="flight-search-section">
        <div class="search-box">
            <h1>Search Flights</h1>
            <form id="search-form" class="search-form">
                <div class ="search-input-group">
                    <div class="input-wrapper">
                        <input type="text" id="from" name="from" placeholder="From" required>
                        <div id="from-suggest" class="suggest"></div>
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="to" name="to" placeholder="To" required>
                        <div id="to-suggest" class="suggest"></div>
                    </div>
                </div>
                <div class ="search-input-date">
                    <input type="date" id="departure" name="departure" required>
                </div>
                <button type="submit" class="search-btn">Search Flights</button>
            </form>
        </div>
    </section>

    <!--Filter Section-->
    <section class="filter-section">
        <div class="filter-container">
            <div class="filter-header">
                <button id="filterToggle" class="filter-toggle-btn">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M2 4h12M4 8h8M6 12h4"/>
                    </svg>
                    Filters
                </button>
            </div>
            <div class="filter-content">
                <div id="filterMenu" class="filter-menu">
                    <form id="filter-form" class="filter-form">
                    <!-- Price -->
                        <div class="form-row">
                            <div class="filter-group">
                                <label for="minPrice">Min price</label>
                                <input type="number" id="minPrice" placeholder="$0">
                            </div>
                            <div class="filter-group">
                                <label for="maxPrice">Max price</label>
                                <input type="number" id="maxPrice" placeholder="Any">
                            </div>
                        </div>
                    <div class="filter-divider"></div>
                    <!-- Time -->
                    <div class="filter-group">
                        <label>Departure time</label>
                        <div class="time-buttons">
                            <button type="button" class="time-btn" data-time="morning">🌅</button>
                            <button type="button" class="time-btn" data-time="noon">🌇</button>
                            <button type="button" class="time-btn" data-time="evening">🌆</button>
                            <button type="button" class="time-btn" data-time="night">🌃</button>
                        </div>
                    </div>
                    <div class="filter-divider"></div>
                    <!-- Airline -->
                    <div class="filter-group">
                        <label for="airline">Airline</label>
                        <select id="airline">
                            <option value="">Any airline</option>
                            <option value="American Airlines">American Airlines</option>
                            <option value="Delta Airlines">Delta Airlines</option>
                            <option value="Southwest Airlines">Southwest Airlines</option>
                            <option value="Spirit Airlines">Spirit Airlines</option>
                            <option value="United Airlines">United Airlines</option>
                        </select>
                    </div>
                    <!-- Footer -->
                    <div class="filter-footer">
                        <button type="button" class="btn-clear" id="clearFilters">Clear all</button>
                        <button type="submit" class="filter-btn">Apply filters</button>
                    </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Results Section -->
    <section class="results-section">
        <div class="results-container">
            <h2>Available Flights</h2>
            <div id="flightResults" class="flight-results"></div>
                <div class = "pages">
                    <button id="prevPage" class="page-btn">⬅ Previous</button>
                    <span id="pageInfo"></span>
                    <button id="nextPage" class="page-btn">Next ➡</button>
                </div>
        </div>
    </section>
    <script src="scripts/booksearch.js"></script>
</body>
</html>
